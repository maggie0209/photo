<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#f7f1e9">
  <title>給你的一本小小相簿</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Noto+Serif+TC:wght@400;500;600;700;900&display=swap');
    :root{--paper:#fffdf9;--ink:#39332f;--muted:#91877d;--rose:#d79080;--line:#ede5db;--bg:#f5f0e9;--serif:'Noto Serif TC',serif;--sans:'DM Sans','Noto Serif TC',sans-serif}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);min-height:100vh}.shell{max-width:1240px;margin:0 auto;padding:28px 42px 34px}.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:30px}.brand{display:flex;align-items:center;gap:11px;font-size:13px;letter-spacing:.12em;color:#756b61}.brand-mark{width:32px;height:32px;border-radius:50%;background:#eee0d6;display:grid;place-items:center;color:#a97968}.top-actions{display:flex;gap:9px}.button{border:1px solid var(--line);background:#fffdf9;color:var(--ink);padding:10px 15px;border-radius:999px;cursor:pointer;font:500 12px var(--sans);transition:.2s;display:inline-flex;align-items:center;gap:7px}.button:hover{transform:translateY(-1px);border-color:#d4b5a5}.button.primary{background:#4f4943;border-color:#4f4943;color:white}.button svg{width:15px;height:15px}.layout{display:grid;grid-template-columns:minmax(0,1fr) 252px;gap:42px;align-items:center}.main{min-width:0}.intro{text-align:center;margin:0 auto 26px}.eyebrow{font:600 10px var(--sans);letter-spacing:.22em;text-transform:uppercase;color:#ad8271;margin-bottom:10px}.title{font:600 clamp(24px,3vw,34px) var(--serif);letter-spacing:.12em;margin:0 0 8px}.subtitle{font:12px var(--serif);color:var(--muted);letter-spacing:.12em}.book-stage{position:relative;min-height:490px;display:flex;align-items:center;justify-content:center;perspective:1800px}.book{position:relative;width:min(100%,780px);height:min(59vw,470px);min-height:350px;display:grid;grid-template-columns:1fr 1fr;filter:drop-shadow(0 18px 20px #65584c1b);transform-style:preserve-3d}.book:before{content:"";position:absolute;z-index:1;left:50%;top:8px;bottom:8px;width:12px;transform:translateX(-50%);background:linear-gradient(90deg,#dfd5c8,#f9f5ef 40%,#d8cec2);border-radius:3px}.page{position:relative;background:var(--paper);overflow:hidden;padding:27px;display:flex;align-items:center;justify-content:center;min-width:0}.page.left{border-radius:7px 0 0 7px;border-right:1px solid #eee9e2;background:linear-gradient(90deg,#fffdf9 95%,#f0e9e0)}.page.right{border-radius:0 7px 7px 0;background:linear-gradient(270deg,#fffdf9 97%,#f0e9e0)}.photo-frame{width:100%;height:100%;background:#eee8df;display:grid;place-items:center;overflow:hidden;position:relative}.photo-frame img{width:auto;height:auto;max-width:100%;max-height:100%;object-fit:contain;display:block}.photo-placeholder{text-align:center;padding:20px;color:#a79a8b}.photo-placeholder .icon{font-size:29px;margin-bottom:10px}.photo-placeholder p{font:12px var(--serif);letter-spacing:.1em;line-height:1.9;margin:0}.caption{position:absolute;bottom:26px;left:38px;right:38px;text-align:center;color:white;font:500 14px var(--serif);text-shadow:0 1px 8px #0009;z-index:1}.caption:empty{display:none}.page.right .photo-frame{background:#f0e9e0}.page-label{position:absolute;bottom:12px;font:10px var(--sans);letter-spacing:.12em;color:#b8aea4}.left .page-label{left:26px}.right .page-label{right:26px}.cover-content{text-align:center;padding:25px}.cover-flower{font-size:28px;color:#cb9888;margin-bottom:19px}.cover-title{font:600 25px/1.7 var(--serif);letter-spacing:.16em}.cover-subtitle{font:11px var(--serif);letter-spacing:.2em;color:#a89788;margin-top:13px}.cover-rule{width:38px;height:1px;background:#d6b6a4;margin:20px auto}.turn-sheet{position:absolute;top:0;bottom:0;left:50%;width:50%;z-index:4;overflow:visible;transform-style:preserve-3d;pointer-events:none;filter:drop-shadow(0 5px 8px #44372b30)}.turn-sheet.forward{transform-origin:left center;animation:page-forward .92s cubic-bezier(.58,.03,.22,1) forwards}.turn-sheet.backward{left:0;transform-origin:right center;animation:page-backward .92s cubic-bezier(.58,.03,.22,1) forwards}.turn-face{position:absolute;inset:0;overflow:hidden;backface-visibility:hidden;background:#fffdf9;border:1px solid #eee7de}.turn-front{z-index:2}.turn-back{transform:rotateY(180deg);background:linear-gradient(90deg,#f3ede5,#fffdf9 12%,#fffdf9);box-shadow:inset 8px 0 12px #73614a10}.turn-face img{position:absolute;inset:0;margin:auto;display:block;width:auto;height:auto;max-width:100%;max-height:100%;object-fit:contain}.turn-face .cover-content{position:absolute;inset:0;display:grid;place-content:center;background:#fffaf2}.turn-sheet:after{content:\"\";position:absolute;inset:0;z-index:3;pointer-events:none;background:linear-gradient(90deg,#fff0 58%,#2d211a38 100%);opacity:0;animation:page-shade .92s cubic-bezier(.58,.03,.22,1) forwards}.turn-sheet.backward:after{background:linear-gradient(270deg,#fff0 58%,#2d211a38 100%)}@keyframes page-forward{0%{transform:rotateY(0)}100%{transform:rotateY(-180deg)}}@keyframes page-backward{0%{transform:rotateY(0)}100%{transform:rotateY(180deg)}}@keyframes page-shade{0%,100%{opacity:0}35%,65%{opacity:1}}.controls{display:flex;align-items:center;justify-content:center;gap:20px;margin-top:3px}.round-btn{width:40px;height:40px;border-radius:50%;border:1px solid #dfd7ce;background:#fbf8f3;color:#5d554e;display:grid;place-items:center;cursor:pointer;transition:.2s}.round-btn:hover:not(:disabled){background:#e8d8cc;transform:scale(1.04)}.round-btn:disabled{opacity:.38;cursor:default}.round-btn svg{width:17px;height:17px}.counter{font-size:11px;letter-spacing:.1em;color:#867c72;min-width:62px;text-align:center}.progress{width:min(290px,50%);height:2px;background:#e2d9cf;margin:16px auto 0;overflow:hidden}.progress i{display:block;height:100%;background:#ca9787;transition:width .35s}.side{border-left:1px solid #e4ddd4;padding-left:25px;align-self:center}.side-heading{font:600 11px var(--sans);letter-spacing:.1em;color:#6d6258;margin:0 0 5px}.side-desc{font:11px/1.8 var(--serif);color:#9a8f84;margin:0 0 17px}.upload-box{border:1px dashed #d9c9bc;border-radius:9px;padding:17px 12px;text-align:center;background:#faf7f2;margin-bottom:17px;cursor:pointer;transition:.2s}.upload-box:hover{border-color:#bd9080;background:#fffaf5}.upload-icon{color:#b47c6d;font-size:20px;margin-bottom:7px}.upload-title{font:500 11px var(--serif)}.upload-hint{font:10px var(--sans);color:#a69a8e;margin-top:5px}.file-input{display:none}.thumbs{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;max-height:190px;overflow:auto}.thumb{position:relative;aspect-ratio:1;border-radius:5px;overflow:hidden;background:#eae2d8;cursor:pointer;border:2px solid transparent}.thumb.active{border-color:#c58c7a}.thumb img{width:100%;height:100%;object-fit:cover}.thumb-num{position:absolute;bottom:3px;right:4px;background:#0008;color:white;border-radius:8px;padding:1px 5px;font:9px var(--sans)}.empty-note{font:10px/1.8 var(--serif);color:#a69a8e;text-align:center;padding:8px 0 17px}.divider{height:1px;background:#e8e0d7;margin:18px 0}.side-row{display:flex;align-items:center;justify-content:space-between;margin:12px 0}.row-label{font:11px var(--serif);color:#766c62}.small-button{border:1px solid #e3dacf;background:#fbf8f3;border-radius:999px;padding:7px 10px;color:#786d62;font:10px var(--sans);cursor:pointer}.small-button:hover{border-color:#c9a594}.music-name{font:10px var(--sans);color:#9a8f84;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:135px}.switch{width:34px;height:19px;border-radius:99px;background:#dcd4cb;position:relative;cursor:pointer;border:0;padding:0;transition:.2s}.switch:after{content:"";position:absolute;width:13px;height:13px;left:3px;top:3px;background:white;border-radius:50%;transition:.2s;box-shadow:0 1px 3px #0002}.switch.on{background:#c58c7a}.switch.on:after{left:18px}.footnote{text-align:center;color:#a79b8e;font:10px var(--serif);letter-spacing:.1em;margin-top:13px}.toast{position:fixed;bottom:22px;left:50%;transform:translate(-50%,12px);background:#504941;color:white;padding:10px 17px;border-radius:99px;font:11px var(--serif);opacity:0;pointer-events:none;transition:.25s;z-index:5}.toast.show{opacity:1;transform:translate(-50%,0)}
    @media(max-width:820px){.shell{padding:18px 20px 28px}.layout{grid-template-columns:1fr;gap:23px}.side{border-left:0;border-top:1px solid #e4ddd4;padding:18px 0 0;max-width:600px;width:100%;margin:0 auto}.book-stage{min-height:390px}.book{height:min(62vw,400px);min-height:290px}.page{padding:18px}.intro{margin-bottom:15px}.topbar{margin-bottom:22px}.side-desc{margin-bottom:12px}.upload-box{padding:13px}.thumbs{grid-template-columns:repeat(6,1fr)}}
    @media(max-width:480px){.shell{padding:14px 13px 22px}.brand{font-size:11px}.top-actions .button{padding:8px 10px;font-size:11px}.topbar{margin-bottom:20px}.book-stage{min-height:310px}.book{min-height:250px;height:70vw}.page{padding:11px}.cover-title{font-size:19px}.cover-flower{margin-bottom:8px}.cover-rule{margin:10px auto}.cover-subtitle{font-size:9px;margin-top:7px}.caption{bottom:17px;left:15px;right:15px;font-size:11px}.page-label{bottom:6px;font-size:8px}.left .page-label{left:12px}.right .page-label{right:12px}.controls{gap:13px}.round-btn{width:36px;height:36px}}
    @media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
  </style>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div class="brand"><span class="brand-mark">✿</span><span>小小心意・電子相簿</span></div>
      <div class="top-actions">
        <button class="button" id="musicBtn" title="選擇背景音樂">♫ <span id="musicButtonLabel">加入音樂</span></button>
        <button class="button" id="exportBtn" title="匯出相簿，分享給朋友">↓ <span>匯出相簿</span></button>
        <button class="button primary" id="playTop" title="自動播放">▷ <span>自動播放</span></button>
      </div>
    </header>
    <main>
      <div class="layout">
        <section class="main">
          <div class="intro">
            <div class="eyebrow">A LITTLE BOOK OF MEMORIES</div>
            <h1 class="title">給你的一本小小相簿</h1>
            <div class="subtitle">把想珍藏的時光，一頁一頁送給你。</div>
          </div>
          <div class="book-stage">
            <div class="book" id="book">
              <div class="page left" id="leftPage"><div class="cover-content"><div class="cover-flower">✿</div><div class="cover-title">我們的<br>小小回憶</div><div class="cover-rule"></div><div class="cover-subtitle">翻開來看看吧</div></div><span class="page-label">A LITTLE GIFT</span></div>
              <div class="page right" id="rightPage"><div class="photo-frame"><div class="photo-placeholder"><div class="icon">♡</div><p>在右邊加入照片<br>開始珍藏回憶</p></div></div><span class="page-label">01</span></div>
            </div>
          </div>
          <div class="controls">
            <button class="round-btn" id="prevBtn" aria-label="上一頁"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="m15 18-6-6 6-6"/></svg></button>
            <span class="counter" id="counter">封面 · 00</span>
            <button class="round-btn" id="nextBtn" aria-label="下一頁"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="m9 18 6-6-6-6"/></svg></button>
          </div>
          <div class="progress"><i id="progressBar" style="width:0%"></i></div>
          <div class="footnote">用心收藏的每一刻，都是最好的禮物</div>
        </section>
        <aside class="side">
          <h2 class="side-heading">收藏你們的時光</h2>
          <p class="side-desc">選一些喜歡的照片，做成只屬於你們的回憶小書。</p>
          <label class="upload-box" for="photoInput"><div class="upload-icon">＋</div><div class="upload-title">加入照片</div><div class="upload-hint">可一次選取多張圖片</div></label>
          <input class="file-input" id="photoInput" type="file" accept="image/*" multiple>
          <div id="photoList"><div class="empty-note">還沒有照片<br>選幾張照片，讓故事開始吧 ♡</div></div>
          <div class="divider"></div>
          <div class="side-row"><span class="row-label">自動翻頁</span><button class="switch" id="autoSwitch" aria-label="切換自動翻頁"></button></div>
          <div class="side-row"><span class="row-label">翻頁速度</span><select class="small-button" id="speed"><option value="3">每 3 秒</option><option value="5" selected>每 5 秒</option><option value="8">每 8 秒</option><option value="12">每 12 秒</option></select></div>
          <div class="side-row"><span class="row-label">背景音樂</span><button class="small-button" id="musicSideBtn">選擇音樂</button></div>
          <div class="side-row"><span class="music-name" id="musicName">尚未選擇音樂</span><button class="small-button" id="musicPlayBtn" aria-label="播放或暫停音樂">▷</button></div>
          <div class="side-row"><span class="row-label">分享給朋友</span><button class="small-button" id="importBtn">匯入相簿</button></div>
          <p class="side-desc">匯出後把相簿檔傳給朋友；朋友打開這個頁面就能匯入觀看。</p>
          <input class="file-input" id="albumInput" type="file" accept=".json,application/json">
          <input class="file-input" id="musicInput" type="file" accept="audio/*">
        </aside>
      </div>
    </main>
  </div>
  <div class="toast" id="toast"></div>
  <audio id="audio" loop></audio>
  <script>
    (()=>{
      const KEY='little-memory-album-v1';let photos=[],index=-1,timer=null,playing=false,audioUrl=null,toastTimer,isTurning=false;
      const $=id=>document.getElementById(id),right=$('rightPage'),left=$('leftPage'),input=$('photoInput'),audio=$('audio');
      const escapeHtml=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
      function toast(s){const t=$('toast');t.textContent=s;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),2200)}
      function restore(){try{const raw=localStorage.getItem(KEY);if(raw){const saved=JSON.parse(raw);photos=Array.isArray(saved)?saved:[]}}catch{photos=[]}render()}
      function save(){try{localStorage.setItem(KEY,JSON.stringify(photos))}catch{toast('瀏覽器儲存空間不足，請減少照片或改用較小的圖片。')}}
      function render(){
        const list=$('photoList');list.innerHTML=photos.length?'<div class="thumbs">'+photos.map((p,i)=>`<button class="thumb ${i===index?'active':''}" data-index="${i}" aria-label="第 ${i+1} 張照片"><img src="${p.src}" alt=""><span class="thumb-num">${i+1}</span></button>`).join('')+'</div>':'<div class="empty-note">還沒有照片<br>選幾張照片，讓故事開始吧 ♡</div>';
        list.querySelectorAll('.thumb').forEach(b=>b.addEventListener('click',()=>go(Number(b.dataset.index))));
        if(index<0){right.innerHTML='<div class="photo-frame"><div class="photo-placeholder"><div class="icon">♡</div><p>在右邊加入照片<br>開始珍藏回憶</p></div></div><span class="page-label">01</span>';left.innerHTML='<div class="cover-content"><div class="cover-flower">✿</div><div class="cover-title">我們的<br>小小回憶</div><div class="cover-rule"></div><div class="cover-subtitle">翻開來看看吧</div></div><span class="page-label">A LITTLE GIFT</span>'}
        else{const p=photos[index];left.innerHTML=`<div class="photo-frame"><img src="${p.src}" alt="${escapeHtml(p.name||'相簿照片')}"><div class="caption">${escapeHtml(p.caption||'')}</div></div><span class="page-label">${String(index+1).padStart(2,'0')}</span>`;if(index+1<photos.length){const n=photos[index+1];right.innerHTML=`<div class="photo-frame"><img src="${n.src}" alt="${escapeHtml(n.name||'相簿照片')}"><div class="caption">${escapeHtml(n.caption||'')}</div></div><span class="page-label">${String(index+2).padStart(2,'0')}</span>`}else{right.innerHTML=`<div class="cover-content"><div class="cover-flower">♡</div><div class="cover-title">美好的回憶<br>未完待續</div><div class="cover-rule"></div><div class="cover-subtitle">TO BE CONTINUED</div></div><span class="page-label">THE END</span>`}}
        $('counter').textContent=index<0?'封面 · 00':`${String(index+1).padStart(2,'0')} / ${String(photos.length).padStart(2,'0')}`;$('prevBtn').disabled=index<0;$('nextBtn').disabled=!photos.length||index>=photos.length-1;$('progressBar').style.width=photos.length?`${(index+1)/photos.length*100}%`:'0%';
      }
      function go(n){if(n<0||n>=photos.length||isTurning||n===index)return;const old=index,forward=old<0||n>old,book=$('book'),sheet=document.createElement('div');isTurning=true;const cover=()=>{const el=document.createElement('div');el.className='cover-content';el.innerHTML='<div class="cover-flower">✿</div><div class="cover-title">我們的<br>小小回憶</div><div class="cover-rule"></div><div class="cover-subtitle">翻開來看看吧</div>';return el};sheet.className='turn-sheet '+(forward?'forward':'backward');const front=document.createElement('div');front.className='turn-face turn-front';const frontImg=document.createElement('img');frontImg.src=photos[forward?n:old].src;frontImg.alt='';front.appendChild(frontImg);const back=document.createElement('div');back.className='turn-face turn-back';if(old>=0){const backImg=document.createElement('img');backImg.src=photos[old].src;backImg.alt='';back.appendChild(backImg)}else back.appendChild(cover());sheet.append(front,back);book.appendChild(sheet);$('prevBtn').disabled=true;$('nextBtn').disabled=true;sheet.addEventListener('animationend',()=>{index=n;sheet.remove();isTurning=false;render()},{once:true})}
      input.addEventListener('change',async e=>{const files=[...e.target.files].filter(f=>f.type.startsWith('image/'));for(const f of files){try{const src=await compress(f);photos.push({src,name:f.name,caption:''})}catch{toast('有一張照片讀取失敗，請再試一次。')}}if(index<0&&photos.length)index=0;save();render();e.target.value='';if(files.length)toast(`已加入 ${files.length} 張照片 ♡`)});
      function compress(file){return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onerror=reject;reader.onload=()=>{const img=new Image();img.onerror=reject;img.onload=()=>{const max=1500,scale=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*scale);c.height=Math.round(img.height*scale);c.getContext('2d').drawImage(img,0,0,c.width,c.height);resolve(c.toDataURL('image/jpeg',.84))};img.src=reader.result};reader.readAsDataURL(file)})}
      $('exportBtn').addEventListener('click',()=>{if(!photos.length){toast('先加入照片，再匯出相簿吧 ♡');return}const blob=new Blob([JSON.stringify({title:'給你的一本小小相簿',photos},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='給你的小小相簿.json';a.click();URL.revokeObjectURL(url);toast('相簿已匯出，可以傳給朋友囉 ♡')});
      $('importBtn').addEventListener('click',()=>$('albumInput').click());$('albumInput').addEventListener('change',async e=>{const f=e.target.files[0];if(!f)return;try{const data=JSON.parse(await f.text());if(!Array.isArray(data.photos)||data.photos.some(p=>typeof p.src!=='string'||!p.src.startsWith('data:image/')))throw new Error('invalid');photos=data.photos;index=photos.length?0:-1;save();render();toast(`已匯入 ${photos.length} 張照片 ♡`)}catch{toast('這不是有效的小小相簿檔案。')}e.target.value=''});
      $('nextBtn').addEventListener('click',()=>{if(index<0&&photos.length)go(0);else go(index+1)});$('prevBtn').addEventListener('click',()=>{if(index===0){index=-1;render()}else go(index-1)});
      function setAuto(on){playing=on;$('autoSwitch').classList.toggle('on',on);$('playTop').innerHTML=(on?'Ⅱ':'▷')+' <span>'+(on?'暫停播放':'自動播放')+'</span>';clearInterval(timer);if(on){if(!photos.length){playing=false;$('autoSwitch').classList.remove('on');$('playTop').innerHTML='▷ <span>自動播放</span>';toast('先加入照片，就可以開始播放囉 ♡');return}if(index<0)go(0);timer=setInterval(()=>{if(index<photos.length-1)go(index+1);else{setAuto(false);toast('相簿播放完畢 ♡')}},Number($('speed').value)*1000)}}
      $('autoSwitch').addEventListener('click',()=>setAuto(!playing));$('playTop').addEventListener('click',()=>setAuto(!playing));$('speed').addEventListener('change',()=>{if(playing)setAuto(true)});
      function chooseMusic(){ $('musicInput').click() }$('musicBtn').addEventListener('click',toggleAudio);$('musicSideBtn').addEventListener('click',chooseMusic);
      $('musicInput').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;if(audioUrl)URL.revokeObjectURL(audioUrl);audioUrl=URL.createObjectURL(f);audio.src=audioUrl;$('musicName').textContent=f.name;$('musicButtonLabel').textContent='播放音樂';$('musicPlayBtn').textContent='▷';toast('音樂已準備好，按播放開始 ♫');e.target.value=''});
      async function toggleAudio(){if(!audio.src){chooseMusic();return}if(audio.paused){try{await audio.play();$('musicPlayBtn').textContent='Ⅱ';$('musicButtonLabel').textContent='音樂播放中'}catch{toast('無法播放這個音訊檔案。')}}else{audio.pause();$('musicPlayBtn').textContent='▷';$('musicButtonLabel').textContent='播放音樂'}}$('musicPlayBtn').addEventListener('click',toggleAudio);$('musicBtn').addEventListener('dblclick',toggleAudio);
      document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')$('nextBtn').click();if(e.key==='ArrowLeft')$('prevBtn').click()});restore();
    })();
  </script>
</body>
</html>
